# MAVY NEWS website on the VPS host nginx (next to rentipa.com and themavy.com).
# Installed as /etc/nginx/sites-available/mavynews.com. certbot adds the https (443) part.
server {
    listen 80;
    listen [::]:80;
    server_name mavynews.com www.mavynews.com;
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:8474;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
