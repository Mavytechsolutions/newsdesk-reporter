# MAVY NEWS server + database. Hostinger VPS project "mavy-news". Separate from apbja and rentipa.
# Data: /var/lib/mavy-news/db (database) and /var/lib/mavy-news/media (uploaded photos). Code: fresh copy from GitHub on every restart.
services:
  db:
    image: postgres:16-alpine
    container_name: mavy-news-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=mavy
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=mavy
    volumes:
      - /var/lib/mavy-news/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mavy"]
      interval: 5s
      retries: 20
  api:
    image: node:22-alpine
    container_name: mavy-news-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8474:4000"
    environment:
      - NODE_ENV=development
      - PORT=4000
      - DATABASE_URL=postgresql://mavy:${DB_PASSWORD}@db:5432/mavy
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - SMS_PROVIDER=console
      - SEED_ADMIN_EMAIL=admin@mavynews.in
      - SEED_ADMIN_PASSWORD=${ADMIN_PASSWORD}
      # master admin logs in as "admin"; password-change OTPs go to this mobile
      - SEED_ADMIN_USERNAME=admin
      - ADMIN_RECOVERY_PHONE=8886688864
      - CORS_ORIGINS=https://www.mavynews.com,https://mavynews.com,http://194.238.17.81:8474
      - PUBLIC_WEB_URL=https://www.mavynews.com
      - APP_DOWNLOAD_URL=http://194.238.17.81:8475
      - MEDIA_DIR=/data/media
      # TESTING ONLY: every number logs in with OTP 1234. Remove this line when real SMS is set up.
      - OTP_FIXED_CODE=1234
    volumes:
      - /var/lib/mavy-news/media:/data/media
    command: ["sh", "-c", "apk add --no-cache git >/dev/null && rm -rf /src && git clone -q --depth 1 -b mavy-news-app https://github.com/Mavytechsolutions/newsdesk-reporter /src && exec sh /src/deploy/api-run.sh"]
