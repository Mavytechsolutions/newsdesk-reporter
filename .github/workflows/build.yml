name: Build Android app

on:
  push:
    branches: [android-app]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      APP_VERSION_CODE: ${{ github.run_number }}
      APP_VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install and copy the app files
        run: |
          npm ci
          npx cap sync android
      - name: Signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > $RUNNER_TEMP/upload.jks; echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> $GITHUB_ENV; else echo "No signing key secret — building a debug-signed test APK only"; fi
      - name: Build
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$ANDROID_KEYSTORE_FILE" ]; then ./gradlew --no-daemon bundleRelease assembleRelease; else ./gradlew --no-daemon assembleDebug bundleRelease; fi
      - name: Collect files
        run: |
          mkdir -p out
          cp android/app/build/outputs/bundle/release/*.aab out/MAVY-News-Maker-$APP_VERSION_NAME$([ -z "$ANDROID_KEYSTORE_FILE" ] && echo -unsigned).aab 2>/dev/null || true
          cp android/app/build/outputs/apk/release/*.apk out/MAVY-News-Maker-$APP_VERSION_NAME.apk 2>/dev/null || true
          cp android/app/build/outputs/apk/debug/*.apk out/MAVY-News-Maker-$APP_VERSION_NAME-test.apk 2>/dev/null || true
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: mavy-news-maker-${{ env.APP_VERSION_NAME }}
          path: out/*
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION_NAME }}
          name: MAVY News Maker ${{ env.APP_VERSION_NAME }}
          files: out/*
