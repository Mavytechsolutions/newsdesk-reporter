# Builds the APBJA Android app (APK) whenever the android/ folder changes.
# The APK and build log go to the apbja-build branch:
# https://raw.githubusercontent.com/Mavytechsolutions/newsdesk-reporter/apbja-build/APBJA.apk
name: Android app
on:
  push:
    branches: [apbja-app]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - name: Build
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          cd android && gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee ../build.log
      - name: Publish APK to the apbja-build branch
        if: always()
        run: |
          mkdir out
          cp build.log out/ || true
          cp android/app/build/outputs/apk/release/app-release.apk out/APBJA.apk || true
          echo "commit=${GITHUB_SHA} result=${{ steps.build.outcome }} run=${GITHUB_RUN_NUMBER}" > out/RESULT.txt
          cd out
          git init -q -b apbja-build
          git config user.name "apbja-build"; git config user.email "build@apbja.local"
          git add -A && git commit -q -m "Android build ${GITHUB_RUN_NUMBER}: ${{ steps.build.outcome }}"
          git push -f -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" apbja-build
