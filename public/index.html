<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>APBJA Member App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&display=swap" rel="stylesheet">
<style>
/* VOICE: proud, official, friendly — a journalists' union in your pocket
   IDEA: the press ID card on a lanyard; every screen grows from that card
   PICTURE: the red-and-ink member card with logo, photo and verified seal
   COLOUR and TYPE: broadcast red #d6001c, ink #15171c, white; blue verified tick; Archivo wide for headings
   LAYOUT: one phone column, hero band on top, big cards, bottom tab bar */
:root{color-scheme:light dark;--bg:light-dark(#eeedea,#0c0d10);--card:light-dark(#fff,#17191e);--ink:light-dark(#15171c,#f1f1ef);--mut:light-dark(#686760,#a3a29c);--line:light-dark(#e4e2dd,#2a2c32);--chip:light-dark(#f4f3f0,#22242a);--red:#d6001c;--red2:#a30016;--redsoft:light-dark(#fde9eb,#3a1218);--blue:#1769e0;--F:Archivo,system-ui,sans-serif}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--F);overflow-x:clip}
.app{max-width:440px;margin:0 auto;min-height:100dvh;background:var(--card);display:flex;flex-direction:column;box-shadow:0 0 0 1px var(--line)}
header.bar{background:var(--red);color:#fff;padding:12px 14px;display:flex;gap:10px;align-items:center;position:sticky;top:0;z-index:5}
header.bar h1{font:800 18px/1.15 var(--F);font-stretch:110%;margin:0}header.bar small{display:block;font-size:13px;opacity:.9}
.back{background:rgba(255,255,255,.16);border:0;color:#fff;font-size:24px;width:44px;height:44px;border-radius:12px;cursor:pointer;flex:none}
.logo{width:44px;height:44px;border-radius:50%;background:#fff;flex:none}
main{flex:1;padding:16px 16px 24px}
.hero{background:linear-gradient(160deg,var(--red) 0%,var(--red2) 100%);color:#fff;padding:18px 16px 56px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;border:28px solid rgba(255,255,255,.07)}
.hero .row{position:relative;z-index:1}.hero h2{color:#fff;margin:0;font-size:24px}.hero p{margin:2px 0 0;opacity:.92;font-size:15px}
.lift{margin-top:-40px;position:relative;z-index:2}
nav.tabs{position:sticky;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);z-index:5}
nav.tabs button{flex:1;background:none;border:0;color:var(--mut);font:600 12.5px var(--F);padding:8px 2px 10px;min-height:58px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
nav.tabs button.on{color:var(--red)}nav.tabs svg{width:24px;height:24px}
.badge{background:var(--red);color:#fff;border-radius:10px;font-size:12px;padding:0 6px;font-weight:700;line-height:18px}
nav.tabs .badge{position:absolute;top:4px;left:55%}
h2{font:800 23px/1.12 var(--F);font-stretch:106%;margin:4px 0 12px;text-wrap:balance}
h3{font:700 17px var(--F);margin:22px 0 8px;display:flex;justify-content:space-between;align-items:baseline}
h3 small{font-weight:500;color:var(--mut);font-size:14px}
p{margin:0 0 10px}.mut{color:var(--mut);font-size:14px}
label.f{display:block;font-weight:600;font-size:14px;margin:14px 0 5px}
input,select,textarea{width:100%;font:16px var(--F);padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);min-height:48px}
textarea{min-height:110px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid color-mix(in srgb,var(--red) 40%,transparent);outline-offset:1px}
.btn{display:flex;justify-content:center;align-items:center;gap:8px;width:100%;background:var(--red);color:#fff;border:0;border-radius:14px;font:700 17px var(--F);padding:13px;min-height:52px;margin-top:16px;cursor:pointer;text-decoration:none}
.btn.ghost{background:var(--chip);color:var(--ink)}.btn.ink{background:var(--ink);color:var(--card)}
.btn.sm{display:inline-flex;width:auto;font-size:15px;padding:8px 14px;min-height:44px;margin:0;border-radius:12px}
.row{display:flex;gap:10px;align-items:center}.grow{flex:1}
.card{border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;background:var(--card)}
.av{width:46px;height:46px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:800;flex:none;overflow:hidden;font-size:16px}
.av img,.ph img{width:100%;height:100%;object-fit:cover}.av.sm{width:40px;height:40px;font-size:14px}.av.lg{width:64px;height:64px;font-size:22px;border:3px solid #fff}
.list .it,.card.list .it{display:flex;gap:12px;align-items:center;padding:11px 2px;border:0;border-bottom:1px solid var(--line);cursor:pointer;width:100%;background:none;text-align:left;color:var(--ink);font:inherit}
.it .tx{flex:1}.it b{display:block;line-height:1.25}.it .mut{display:block}.chev{color:var(--mut);font-size:22px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--red);flex:none}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 10px;box-shadow:0 6px 18px rgba(0,0,0,.06);text-align:left;font:inherit;color:var(--ink);cursor:pointer}
.stat b{display:block;font-size:28px;line-height:1;font-weight:800;font-stretch:110%}.stat span{font-size:13px;color:var(--mut)}.stat.hot b{color:var(--red)}
.act{display:flex;gap:12px;align-items:center;width:100%;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;text-align:left;font:inherit;color:var(--ink);cursor:pointer;min-height:68px}
.act .ic{width:44px;height:44px;border-radius:12px;background:var(--redsoft);color:var(--red);display:grid;place-items:center;flex:none}.act .ic svg{width:24px;height:24px}
.act b{display:block;font-size:16px}.act span.mut{display:block}
.act.alert{background:var(--red);color:#fff;border:0}.act.alert .ic{background:rgba(255,255,255,.2);color:#fff}.act.alert .mut,.act.alert .chev{color:#fff;opacity:.9}
.seg{display:flex;background:var(--chip);border-radius:12px;padding:4px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:9px;border-radius:9px;font:600 15px var(--F);color:var(--mut);min-height:42px;cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px #0002}
.opt{display:flex;gap:12px;align-items:center;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;cursor:pointer;background:var(--card)}
.opt input{width:22px;height:22px;min-height:0;accent-color:var(--red);flex:none}.opt b{display:block}.opt.on{border-color:var(--red);background:var(--redsoft)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chips label{display:flex;gap:6px;align-items:center;background:var(--chip);padding:8px 12px;border-radius:20px;font-size:15px;cursor:pointer;min-height:42px;border:1.5px solid transparent}
.chips label.on{border-color:var(--red);background:var(--redsoft)}.chips input{width:18px;height:18px;min-height:0;accent-color:var(--red)}
.count{display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--card);border-radius:14px;padding:12px 14px;margin:14px 0}
.count b{font-size:28px;font-weight:800;line-height:1}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:10px;background:var(--redsoft);color:var(--red);white-space:nowrap}
.tag.g{background:var(--chip);color:var(--mut)}.tag.v{background:color-mix(in srgb,var(--blue) 14%,transparent);color:var(--blue)}
.btn svg{width:20px;height:20px;flex:none}.row>.btn.grow{flex:1 1 0;font-size:15.5px;padding:12px 6px;gap:6px;margin-top:0}.btn.wa{background:#1f9d55;color:#fff}.btn.sm.wa{background:#e6f6ec;color:#137a3f}
.call{display:inline-block;font-weight:700;color:var(--red);text-decoration:none;font-size:15px;margin-top:2px}
.bubble{max-width:82%;padding:9px 12px;border-radius:16px;margin:6px 0;background:var(--chip)}
.bubble.me{margin-left:auto;background:var(--red);color:#fff}.bubble small{display:block;opacity:.7;font-size:12px}
.hint{background:var(--redsoft);border-radius:12px;padding:11px 13px;font-size:14px;margin:10px 0}
.notice{border-left:4px solid var(--red)}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:#15171c;color:#fff;padding:11px 18px;border-radius:12px;font-size:15px;z-index:9;max-width:90vw;box-shadow:0 8px 24px #0004}
.slot{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;font:inherit;color:var(--ink);text-align:left;cursor:pointer;min-height:52px}
.slot .p{font-size:13px;color:var(--mut);display:block}.slot.vac b{color:var(--mut);font-weight:500}
.photo-pick{display:flex;gap:14px;align-items:center;cursor:pointer;margin:6px 0}
.photo-pick input{display:none}.photo-pick .ph{width:84px;height:84px;border-radius:18px;background:var(--chip);display:grid;place-items:center;overflow:hidden;border:2px dashed var(--line);color:var(--mut);font-size:30px;flex:none}
/* ID card */
.idc{border-radius:20px;overflow:hidden;background:#fff;color:#15171c;box-shadow:0 14px 34px rgba(0,0,0,.16);border:1px solid #e6e3de;position:relative}
.idc-top{background:linear-gradient(120deg,#d6001c,#a30016);color:#fff;padding:12px 14px;display:flex;gap:10px;align-items:center;position:relative}
.idc-top::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.06) 0 8px,transparent 8px 16px)}
.idc-top img{width:44px;height:44px;border-radius:50%;background:#fff;position:relative;z-index:1;flex:none}
.idc-top div{position:relative;z-index:1}.idc-top b{display:block;font-size:15px;line-height:1.15;font-stretch:108%}.idc-top span{font-size:12px;opacity:.9}
.idc-main{display:flex;gap:14px;padding:16px 14px 6px;align-items:center}
.idc .ph{width:92px;height:108px;border-radius:14px;background:#f1efeb;display:grid;place-items:center;overflow:hidden;font:800 30px var(--F);color:#d6001c;flex:none;border:3px solid #fff;box-shadow:0 0 0 1px #e6e3de}
.idc .nm{font:800 21px/1.12 var(--F);font-stretch:106%}.idc .rl{font-size:14px;color:#d6001c;font-weight:700;margin-top:3px}
.ver{display:inline-flex;gap:5px;align-items:center;background:#e8f0fd;color:#1769e0;font-weight:700;font-size:13px;border-radius:20px;padding:3px 10px 3px 4px;margin-top:8px}
.ver i{width:18px;height:18px;border-radius:50%;background:#1769e0;color:#fff;display:grid;place-items:center;font-style:normal;font-size:12px}
.ver.pend{background:#fff4e0;color:#9a5b00}.ver.pend i{background:#c47a00}
.idc dl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:9px 14px;margin:0;padding:10px 14px 14px}
.idc dt{font-size:11.5px;color:#77756f;font-weight:600}.idc dd{margin:0;font-weight:700;font-size:15px;overflow-wrap:anywhere}.idc .w{grid-column:1/-1}
.idc-foot{background:#15171c;color:#fff;font-size:12.5px;padding:9px 14px;display:flex;justify-content:space-between;gap:8px}
.idc-foot b{letter-spacing:.04em}
.idmini{display:flex;gap:12px;align-items:center;width:100%;border:0;font:inherit;text-align:left;cursor:pointer;background:var(--card);color:var(--ink);border-radius:18px;padding:14px;box-shadow:0 10px 26px rgba(0,0,0,.12);border:1px solid var(--line)}
.login-hero{background:linear-gradient(165deg,#d6001c,#8f0013);color:#fff;text-align:center;padding:44px 20px 64px;position:relative;overflow:hidden}
.login-hero::before,.login-hero::after{content:"";position:absolute;border-radius:50%;border:30px solid rgba(255,255,255,.06)}
.login-hero::before{width:260px;height:260px;left:-120px;top:-80px}.login-hero::after{width:200px;height:200px;right:-90px;bottom:-60px}
.login-hero img{width:112px;height:112px;border-radius:50%;background:#fff;box-shadow:0 10px 30px rgba(0,0,0,.3);position:relative;z-index:1}
.login-hero h1{font:800 26px/1.1 var(--F);font-stretch:110%;margin:16px 0 6px;position:relative;z-index:1}.login-hero p{opacity:.9;margin:0;position:relative;z-index:1}
.login-card{background:var(--card);margin:-36px 16px 0;border-radius:20px;padding:18px;box-shadow:0 14px 34px rgba(0,0,0,.14);position:relative;z-index:2;border:1px solid var(--line)}
.otp{display:flex;gap:10px;justify-content:center}.otp input{width:58px;height:62px;text-align:center;font-size:26px;font-weight:800;padding:0}
@media(prefers-reduced-motion:no-preference){.toast{animation:up .25s ease}@keyframes up{from{opacity:0;transform:translate(-50%,10px)}}}

/* ---- professional polish ---- */
.btn{box-shadow:0 1px 0 rgba(0,0,0,.04),0 6px 14px -6px rgba(214,0,28,.55);transition:transform .08s ease,box-shadow .15s ease,background .15s ease;letter-spacing:.005em}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.55;box-shadow:none}
.btn.ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--line);box-shadow:0 1px 2px rgba(0,0,0,.05)}
.btn.ghost:active{background:var(--chip)}
.btn.danger{background:var(--card);color:var(--red);border:1.5px solid color-mix(in srgb,var(--red) 35%,transparent);box-shadow:none}
.btn.wa{background:#1f9d55;box-shadow:0 6px 14px -6px rgba(31,157,85,.6)}
.btn.sm{min-height:44px;border-radius:12px;font-size:15px;padding:8px 14px}
.ib{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;flex:none;text-decoration:none}
.ib svg{width:20px;height:20px}.ib.wa{color:#1a8a4a;border-color:#bfe5cd;background:#f1faf4}.ib.call{color:var(--red);border-color:color-mix(in srgb,var(--red) 25%,transparent);background:var(--redsoft)}
.ib:active{transform:scale(.95)}
.pt{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}.pt svg{width:14px;height:14px;flex:none}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:4px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;text-align:left;cursor:pointer;min-height:118px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.tile:active{transform:scale(.98)}
.tile .ic{width:42px;height:42px;border-radius:12px;background:var(--redsoft);color:var(--red);display:grid;place-items:center}.tile .ic svg{width:22px;height:22px}
.tile b{font-size:15.5px;line-height:1.2}.tile span.mut{font-size:13px;line-height:1.3}
.tile.dark .ic{background:var(--ink);color:var(--card)}
nav.tabs{box-shadow:0 -6px 20px rgba(0,0,0,.05)}
nav.tabs button.on svg{background:var(--redsoft);border-radius:12px;padding:3px 12px;width:48px;height:30px}
nav.tabs svg{padding:3px 12px;width:48px;height:30px;box-sizing:border-box}
.it .tx .mut{line-height:1.35}
.card{box-shadow:0 1px 2px rgba(0,0,0,.04)}
.act{box-shadow:0 1px 2px rgba(0,0,0,.04)}
.composer{position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 12px;display:flex;gap:8px;align-items:flex-end}
.composer textarea{min-height:48px;max-height:140px;flex:1;border-radius:24px;padding:12px 16px}
.composer .btn{width:52px;min-height:48px;margin:0;border-radius:50%;padding:0;flex:none}
.av.muted{background:var(--chip);color:var(--mut)}
.sec{font-size:13px;font-weight:700;color:var(--mut);margin:22px 0 8px;letter-spacing:.02em}
</style>
</head>

const ph5=p=>p?p.replace(/(\d{5})(\d{5})/,'$1 $2'):'';

let S={me:null,members:[],msgs:[]};
const TK='apbja-token';let TOKEN='';try{TOKEN=localStorage.getItem(TK)||''}catch(e){}
async function api(p,data){
  let r;try{r=await fetch('/api/'+p,{method:data?'POST':'GET',headers:{'content-type':'application/json',authorization:'Bearer '+TOKEN},body:data?JSON.stringify(data):undefined})}catch(e){throw new Error('No internet. Check your connection and try again.')}
  const j=await r.json().catch(()=>({error:'Server problem. Try again.'}));
  if(r.status===401&&p!=='login'){TOKEN='';try{localStorage.removeItem(TK)}catch(e){}V.me=null;V.view='login';render()}
  if(!r.ok)throw new Error(j.error||'Something went wrong');return j;
}
function setState(st){S=st||{me:null,members:[],msgs:[]};V.me=S.me}

  approved().filter(x=>x.head&&x.head.districts.includes(v.district)&&x.id!==v.id).forEach(x=>out.set(x.id,x));
  const p=presOf(v.district);if(p&&p.id!==v.id)out.set(p.id,p);
  if(!isPres(v))approved().filter(x=>x.district===v.district&&x.post!=='Member'&&!isPres(x)&&x.id!==v.id&&rank(x)<rank(v)).sort((a,b)=>rank(a)-rank(b)).forEach(x=>out.set(x.id,x));
  return v.admin?[]:[...out.values()];
}
function dmPeople(v){
  if(v.admin)return approved().filter(m=>m.id!==v.id);
  const set=new Map(leaders(v).map(m=>[m.id,m]));
  const sc=scope(v);approved().filter(m=>sc.includes(m.district)&&m.id!==v.id).forEach(m=>set.set(m.id,m));
  S.msgs.filter(x=>x.kind==='dm'&&x.to.includes(v.id)).forEach(x=>{const f=Mb(x.from);if(f)set.set(f.id,f)});
  return [...set.values()];
}
const myNotices=v=>S.msgs.filter(x=>x.kind==='notice'&&x.to.includes(v.id)).sort((a,b)=>b.ts-a.ts);
const unread=v=>S.msgs.filter(x=>x.to.includes(v.id)&&!x.read.includes(v.id)).length;
function nextMid(){return String(Math.max(8000,...S.members.map(m=>parseInt(m.mid)||0))+1)}
function setPresident(d,m){const old=presOf(d);if(old&&old.id!==m.id){old.post='Member';old.no=0}m.district=d;m.post='President';m.no=0;m.status='approved';if(!m.mid)m.mid=nextMid();if(!m.approvedAt)m.approvedAt=Date.now()}
function givePost(m,key){
  if(key==='Member'){m.post='Member';m.no=0;return}
  if(key==='President'){setPresident(m.district,m);return}
  const [p,no]=key.split('|');const t=approved().find(x=>x.district===m.district&&x.post===p&&x.no===+no&&x.id!==m.id);
  if(t){t.post='Member';t.no=0}if(isPres(m)){}m.post=p;m.no=+no;
}

  if(a==='tab')tab(t.dataset.v);
  else if(a==='open')open(t.dataset.v);
  else if(a==='back'){if(['otp','register'].includes(V.view)&&!(v&&v.status==='approved')){V.view='login';return render()}V.view=V.stack.pop()||'home';V.q='';render()}
  else if(a==='logout'){api('logout',{}).catch(()=>{});TOKEN='';try{localStorage.removeItem(TK)}catch(e){}setState(null);V.phone='';V.stack=[];V.view='login';render()}
  else if(a==='seg'){V.tab=t.dataset.t;render()}
  else if(a==='sdo'){V.sdo=t.dataset.t;render(true)}
  else if(a==='district'){V.d=t.dataset.d;open('district')}
  else if(a==='member'){V.sel=t.dataset.id;open('member')}
  else if(a==='thread'){V.sel=t.dataset.id;if(V.view==='newdm'){V.view='thread';render()}else open('thread')}
  else if(a==='slot'){V.slot={p:t.dataset.p,no:+t.dataset.n};open('slotpick')}
  else if(a==='pickslot'){const m=Mb(t.dataset.id),key=V.slot.p+'|'+V.slot.no;if(await act({type:'post',id:m.id,key},'✓ '+m.name+' is now '+V.slot.p+(V.slot.no?' '+V.slot.no:''))){V.view=V.stack.pop();V.q='';render()}}
  else if(a==='approve'){const m=Mb(t.dataset.id);if(await act({type:'approve',id:m.id})){toast('✓ '+m.name+' approved — ID card APBJA-'+(Mb(m.id)||{}).mid);render(true)}}
  else if(a==='reject'){const m=Mb(t.dataset.id);if(await act({type:'reject',id:m.id},m.name+' rejected'))render(true)}
  else if(a==='hdset'){V.hd=t.dataset.k==='rs'?[...RAYALASEEMA]:[];if(t.dataset.k==='rs'&&!V.ht)V.ht='Rayalaseema In-charge';render(true)}
  else if(a==='export'){if(busy)return;busy=true;toast('Preparing the file…');try{const j=await api('export',{fmt:t.dataset.fmt,district:t.dataset.d||''});location.href=j.url}catch(err){toast(err.message)}finally{busy=false}}
  else if(a==='delok'){const m=Mb(t.dataset.id);if(await act({type:'delok',id:m.id},m.name+' removed')){if(V.view==='member'){V.view=V.stack.pop()||'home'}render(true)}}
  else if(a==='delno'){const m=Mb(t.dataset.id);if(await act({type:'delno',id:m.id},m.name+' kept'))render(true)}
  else if(a==='delcancel'){if(await act({type:'delcancel',id:t.dataset.id},'Request cancelled'))render(true)}
  else if(a==='remove'){if(V.cr2!==t.dataset.id){V.cr2=t.dataset.id;toast('Tap Remove again to confirm');setTimeout(()=>V.cr2=null,4000);return}V.cr2=null;const m=Mb(t.dataset.id);if(await act({type:'remove',id:m.id},m.name+' removed')){V.view=V.stack.pop()||'home';render()}}
  else if(a==='preset'){V.preset=t.dataset.k;open('headpick')}
  else if(a==='pickhead'){const r=ROLES.find(x=>x.k===V.preset),m=Mb(t.dataset.id);if(await act({type:'head',id:m.id,title:r.title,districts:r.districts,unique:true},'✓ '+m.name+' is now '+r.title)){V.view=V.stack.pop();V.q='';render()}}
  else if(a==='mkhead'){V.sel=t.dataset.id;V.hd=null;V.ht=undefined;open('headedit')}
  else if(a==='rmhead'){if(await act({type:'rmhead',id:V.sel},'Head role removed')){V.view=V.stack.pop();render()}}
  else if(a==='reset'){if(V.cr){V.cr=false;if(await act({type:'reset'},'Reset done'))tab('home')}else{V.cr=true;toast('Tap Reset again to confirm');setTimeout(()=>V.cr=false,4000)}}
});
app.addEventListener('change',e=>{
  const el=e.target,d=el.dataset;
  if(d.photo!==undefined&&el.files[0]){readPhoto(el.files[0],async url=>{V.photo=url;const ph=el.closest('label').querySelector('.ph');if(ph)ph.innerHTML='<img src="'+url+'" alt="">';
    if(d.photo==='me'&&await act({type:'photo',photo:url},'✓ Photo saved'))render(true);
    if(d.photo==='member'&&await act({type:'memberphoto',id:V.sel,photo:url},'✓ Photo saved'))render(true)});return}
  if(d.sm!==undefined){V.sm=el.value;render(true)}
  else if(d.sd){V.sd=el.checked?[...V.sd,d.sd]:V.sd.filter(x=>x!==d.sd);render(true)}
  else if(d.sp){V.sp=el.checked?[...V.sp,d.sp]:V.sp.filter(x=>x!==d.sp);render(true)}
  else if(d.hd){V.hd=el.checked?[...V.hd,d.hd]:V.hd.filter(x=>x!==d.hd);render(true)}
  else if(d.hall!==undefined){V.hd=el.checked?[...DISTRICTS]:[];render(true)}
});
app.addEventListener('input',e=>{
  const el=e.target,d=el.dataset;
  if(d.keep)V[d.keep]=el.value;
  else if(d.otp!==undefined){el.value=el.value.replace(/\D/g,'');if(el.value&&el.nextElementSibling)el.nextElementSibling.focus();if([...document.querySelectorAll('[data-otp]')].every(i=>i.value))el.form.requestSubmit()}
  else if(d.q!==undefined||d.spq!==undefined){if(d.q!==undefined)V.q=el.value;else V.spq=el.value;const pos=el.selectionStart,sel=d.q!==undefined?'[data-q]':'[data-spq]';render(true);const i=document.querySelector(sel);if(i){i.focus();i.setSelectionRange(pos,pos)}}
});
app.addEventListener('keydown',e=>{if(e.target.dataset.otp!==undefined&&e.key==='Backspace'&&!e.target.value&&e.target.previousElementSibling)e.target.previousElementSibling.focus()});
app.addEventListener('submit',async e=>{
  e.preventDefault();const f=e.target,k=f.dataset.form,fd=new FormData(f),d=Object.fromEntries(fd),v=me();
  const btn=f.querySelector('.btn');
  if(k==='phone'){const p=d.ph.replace(/\D/g,'').slice(-10);if(p.length!==10)return toast('Enter a 10-digit mobile number');V.phone=p;V.view='otp';render()}
  else if(k==='otp'){const code=[...f.querySelectorAll('[data-otp]')].map(i=>i.value).join('');
    try{const j=await api('login',{phone:V.phone,otp:code});TOKEN=j.token;try{localStorage.setItem(TK,TOKEN)}catch(e){}setState(j.state);afterLogin()}
    catch(err){f.querySelectorAll('[data-otp]').forEach(i=>i.value='');f.querySelector('[data-otp]').focus();toast(err.message==='Wrong OTP'?'Wrong OTP. Use 1234 for testing.':err.message)}}
  else if(k==='reg'){if(btn)btn.disabled=true;
    const ok=await act({type:'register',name:d.name,org:d.org,job:d.job,area:d.area,address:d.address,district:d.district,photo:V.photo||''});
    if(btn)btn.disabled=false;if(!ok)return;V.photo='';const m=me();toast(m&&m.status==='approved'?'Profile saved':'Sent for approval');V.view=m&&m.status==='approved'?'home':'waiting';render()}
  else if(k==='send'){const to=recipients().map(m=>m.id);if(!to.length)return toast('Choose who should get it');if(btn)btn.disabled=true;
    if(await act({type:'send',to,label:audLabel(),title:d.title,body:d.body},'✓ Sent to '+to.length+' people')){V.st='';V.sb='';V.sp=[];V.tab='notices';tab('inbox')}else if(btn)btn.disabled=false}
  else if(k==='dm'){if(await act({type:'dm',to:V.sel,body:d.body}))render()}
  else if(k==='setpres'){const p=d.ph.replace(/\D/g,'').slice(-10);if(p.length!==10)return toast('Enter a 10-digit mobile number');
    if(await act({type:'setpres',district:V.d,phone:p})){const m=presOf(V.d);toast('✓ '+(m&&m.name||p)+' is now President of '+V.d);render(true)}}
  else if(k==='post'){const m=Mb(V.sel);if(await act({type:'post',id:m.id,key:d.post})){toast('✓ '+m.name+': '+postName(Mb(V.sel)));render(true)}}
  else if(k==='editm'){if(await act({type:'editm',id:V.sel,name:d.name,phone:(d.phone||'').replace(/\D/g,''),org:d.org,district:d.district,area:d.area},'Saved'))render(true)}
  else if(k==='head'){if(d.title.trim()===ROLES[0].title)return toast('Use the Head of all Presidents box for that role');if(await act({type:'head',id:V.sel,title:d.title,districts:V.hd||[]})){toast('✓ '+Mb(V.sel).name+' is now '+d.title);V.view=V.stack.pop();render()}}
  else if(k==='delreq'){const m=Mb(V.sel);if(await act({type:'delreq',id:m.id,reason:d.reason},'Sent to the In-charge for approval'))render(true)}
  else if(k==='profile'){if(await act({type:'profile',name:d.name,org:d.org,job:d.job,area:d.area,address:d.address},'Profile saved'))render(true)}
});
async function refresh(){if(!TOKEN||!V.me||busy||document.hidden)return;const a=document.activeElement;if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))return;
  try{const j=await api('state');setState(j.state);if(['home','inbox','members','district','waiting','thread'].includes(V.view)){if(V.view==='waiting'&&me()&&me().status==='approved')V.view='home';render(true)}}catch(e){}}
setInterval(refresh,30000);document.addEventListener('visibilitychange',refresh);
(async()=>{
  if(TOKEN){app.innerHTML=`<div class="login-hero" style="min-height:100dvh;display:grid;place-content:center"><img src="${LOGO}" alt=""><h1>APBJA</h1><p>Loading…</p></div>`;
    try{const j=await api('state');if(j.state){setState(j.state);return afterLogin()}V.view='register';return render()}catch(e){if(!TOKEN){V.view='login';return render()}toast(e.message)}}
  render();
})();
}
</script>
</body>
</html>
